[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
fail_under = 60
show_missing = true

[[tool.mypy.overrides]]
module = "ai.*"
ignore_errors = true

[tool.pytest.ini_options]
asyncio_mode = "auto"

[[tool.mypy.overrides]]
module = "asyncpg.*"
ignore_missing_imports = true

[tool.ruff.lint.per-file-ignores]
"tests/test_ai_smoke.py" = ["B017", "BLE001"]
"src/api.py" = ["B008"]